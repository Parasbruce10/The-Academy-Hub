<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#1a365d" />

  <!-- SEO Meta Tags -->
  <title>The Knowledge Hub Academy</title>
  <meta name="description" content="Welcome to The Knowledge Hub Academy. Empowering minds, fostering the future. Top education and learning platform." />
  <meta name="keywords" content="The Knowledge Hub Academy, Education, School, Academy, Learning, Karachi" />
  <link rel="canonical" href="https://theknowlegedhub.bookapexcode.store/" />

  <!-- Open Graph (OG) Tags for Social Media Sharing -->
  <meta property="og:title" content="The Knowledge Hub Academy" />
  <meta property="og:description" content="Empowering minds, fostering the future. Join our academy for excellence in education." />
  <meta property="og:image" content="https://theknowlegedhub.bookapexcode.store/logo.jpg" />
  <meta property="og:url" content="https://theknowlegedhub.bookapexcode.store" />

  <!-- Favicon -->
  <link rel="icon" href="logo.jpeg" type="image/jpeg" />

  <!-- PWA Manifest for App Install -->
  <link rel="manifest" href="manifest.json" />

  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel" src="app.js"></script>

  <!-- Service Worker Registration (Required for App Install prompt) -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then(registration => {
            console.log('Service Worker registered successfully:', registration.scope);
          })
          .catch(error => {
            console.log('Service Worker registration failed:', error);
          });
      });
    }
  </script>
</body>
</html>
